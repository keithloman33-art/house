<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>工程量度 App v5.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #1e272e; --surface: #2f3542; --accent: #00b894; --danger: #eb4d4b; }
        
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { position: fixed; overflow: hidden; width: 100%; height: 100%; margin: 0; background: var(--bg); color: white; }
        body { display: flex; flex-direction: column; font-family: -apple-system, system-ui, sans-serif; }

        /* 頂部數據 */
        #data-header {
            background: rgba(0,0,0,0.5); padding: 10px; display: flex; justify-content: space-around;
            border-bottom: 1px solid #444; font-size: 14px; z-index: 10;
        }
        .stat-val { color: var(--accent); font-weight: bold; font-family: monospace; font-size: 16px; }

        /* 畫布 */
        #canvas-wrapper { flex: 1; background: #111; position: relative; touch-action: none; }

        /* 底部操作區 */
        #bottom-menu {
            background: var(--surface); padding: 10px 10px 30px 10px;
            display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5); z-index: 100;
        }

        /* 比例尺輸入行 - 固定喺掣上面 */
        #calib-ui {
            display: none; background: #3d4654; padding: 10px; border-radius: 10px;
            align-items: center; gap: 8px; border: 1px solid var(--primary);
        }
        #input-mm { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 16px; text-align: center; }
        .confirm-btn { background: var(--accent); color: white; border: none; padding: 12px 15px; border-radius: 8px; font-weight: bold; }

        /* 功能按鈕行 */
        .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn {
            background: #4b6584; color: white; border: none; border-radius: 10px;
            padding: 12px 2px; font-size: 11px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .btn.active { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .btn-large { grid-column: span 2; flex-direction: row; justify-content: center; font-size: 13px; padding: 15px; }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="data-header">
        <div>尺寸: <span id="val-dim" class="stat-val">--</span></div>
        <div>面積: <span id="val-area" class="stat-val">0.00</span> m²</div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="c"></canvas>
    </div>

    <div id="bottom-menu">
        <div id="calib-ui">
            <input type="number" id="input-mm" pattern="[0-9]*" placeholder="輸入長度 (mm)" value="1000">
            <button class="confirm-btn" onclick="confirmCalibration()">OK</button>
            <button class="confirm-btn" style="background:#666" onclick="cancelCalibration()">取消</button>
        </div>

        <div class="btn-row">
            <button class="btn" onclick="document.getElementById('file-input').click()"><span>🖼️</span>圖紙</button>
            <button id="calib-btn" class="btn" onclick="startCalibration()"><span>📏</span>比例</button>
            <button id="rect-btn" class="btn" onclick="createRectRoom()"><span>🧱</span>矩形</button>
            <button id="poly-btn" class="btn" onclick="togglePolyMode()"><span>🖊️</span>自由繪</button>
        </div>

        <div class="btn-row">
            <button class="btn btn-large" style="background:var(--danger)" onclick="clearCanvas()">🗑️ 清空</button>
            <button class="btn btn-large" style="background:var(--accent)" onclick="exportReport()">📋 導出</button>
        </div>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const canvas = new fabric.Canvas('c', {
            width: window.innerWidth,
            height: window.innerHeight - document.getElementById('bottom-menu').offsetHeight - 50,
            backgroundColor: '#111',
            selection: true,
            preserveObjectStacking: true
        });

        let pixelToMmRatio = 1;
        let isPolyDrawing = false;
        let pointArray = [];
        let calibLine;

        // --- 1. 比例尺邏輯 (底部輸入) ---
        function startCalibration() {
            if(calibLine) canvas.remove(calibLine);
            document.getElementById('calib-ui').style.display = 'flex';
            document.getElementById('calib-btn').classList.add('active');
            
            calibLine = new fabric.Line([50, 200, 250, 200], {
                stroke: '#ff7675', strokeWidth: 8, 
                hasControls: true, 
                cornerStyle: 'circle', cornerSize: 40, // 超大觸控點
                transparentCorners: true, cornerColor: 'rgba(255,118,117,0.5)',
                borderColor: 'white'
            });
            canvas.add(calibLine);
            canvas.setActiveObject(calibLine);
        }

        function cancelCalibration() {
            if(calibLine) canvas.remove(calibLine);
            document.getElementById('calib-ui').style.display = 'none';
            document.getElementById('calib-btn').classList.remove('active');
        }

        function confirmCalibration() {
            const mm = document.getElementById('input-mm').value;
            if(!mm || mm <= 0) return alert("請輸入 mm");
            const pxLen = Math.sqrt(
                Math.pow((calibLine.x2 - calibLine.x1) * calibLine.scaleX, 2) + 
                Math.pow((calibLine.y2 - calibLine.y1) * calibLine.scaleY, 2)
            );
            pixelToMmRatio = parseFloat(mm) / pxLen;
            canvas.remove(calibLine);
            calibLine = null;
            document.getElementById('calib-ui').style.display = 'none';
            document.getElementById('calib-btn').classList.remove('active');
            alert("比例已校準！");
        }

        // --- 2. 自由繪 (修復版) ---
        function togglePolyMode() {
            isPolyDrawing = !isPolyDrawing;
            document.getElementById('poly-btn').classList.toggle('active', isPolyDrawing);
            canvas.selection = !isPolyDrawing;
            
            if(!isPolyDrawing) {
                pointArray.forEach(p => canvas.remove(p));
                pointArray = [];
            } else {
                alert("自由繪模式：點擊畫面畫點，點擊第一個綠點完成閉合。");
            }
        }

        canvas.on('mouse:down', (opt) => {
            if (!isPolyDrawing) return;
            const pointer = canvas.getPointer(opt.e);
            
            // 點擊第一個點 (綠色) 閉合
            if (pointArray.length > 2 && opt.target && opt.target.id === pointArray[0].id) {
                const poly = new fabric.Polygon(pointArray.map(p => ({ x: p.left, y: p.top })));
                setupRoom(poly);
                pointArray.forEach(p => canvas.remove(p));
                pointArray = [];
                isPolyDrawing = false;
                document.getElementById('poly-btn').classList.remove('active');
                return;
            }

            const isFirst = pointArray.length === 0;
            const dot = new fabric.Circle({
                radius: 20, // 加大觸控點
                fill: isFirst ? '#00b894' : 'rgba(108, 92, 231, 0.5)',
                left: pointer.x, top: pointer.y,
                originX: 'center', originY: 'center',
                selectable: isFirst, // 只有第一個點可以被選中（用嚟點擊閉合）
                id: isFirst ? 'firstPoint' : 'dot' + Date.now()
            });
            
            pointArray.push(dot);
            canvas.add(dot);
            if(isFirst) dot.bringToFront();
        });

        // --- 3. 繪圖設定 ---
        function setupRoom(obj) {
            obj.set({
                fill: 'rgba(108, 92, 231, 0.3)', stroke: '#6c5ce7', strokeWidth: 2,
                itemType: 'room',
                cornerStyle: 'circle', cornerSize: 25, 
                transparentCorners: true, cornerColor: 'rgba(108,92,231,0.4)'
            });
            canvas.add(obj);
            canvas.setActiveObject(obj);
            updateInfo(obj);
        }

        function createRectRoom() {
            const rect = new fabric.Rect({ left: 100, top: 100, width: 120, height: 100 });
            setupRoom(rect);
        }

        function updateInfo(obj) {
            if (!obj || obj.itemType !== 'room') return;
            const w = (obj.width * obj.scaleX * pixelToMmRatio / 1000).toFixed(2);
            const h = (obj.height * obj.scaleY * pixelToMmRatio / 1000).toFixed(2);
            let area = 0;
            if(obj.type === 'rect') {
                area = w * h;
            } else {
                const pts = obj.points;
                for (let i = 0; i < pts.length; i++) {
                    let j = (i + 1) % pts.length;
                    area += (pts[i].x * obj.scaleX * pixelToMmRatio) * (pts[j].y * obj.scaleY * pixelToMmRatio);
                    area -= (pts[j].x * obj.scaleX * pixelToMmRatio) * (pts[i].y * obj.scaleY * pixelToMmRatio);
                }
                area = Math.abs(area) / 2 / 1000000;
            }
            document.getElementById('val-dim').innerText = `${w}m x ${h}m`;
            document.getElementById('val-area').innerText = area.toFixed(2);
        }

        // --- 監聽 ---
        canvas.on({
            'object:scaling': (e) => updateInfo(e.target),
            'object:moving': (e) => updateInfo(e.target),
            'selection:created': (e) => updateInfo(e.selected[0])
        });

        document.getElementById('file-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), { scaleX: ratio, scaleY: ratio });
                });
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function clearCanvas() { if(confirm("確定清空？")) { canvas.clear(); canvas.setBackgroundColor('#111'); } }
        function exportReport() { alert("面積：" + document.getElementById('val-area').innerText + " m²"); }
        
        // 自動適配螢幕
        window.addEventListener('resize', () => {
            canvas.setDimensions({ width: window.innerWidth, height: window.innerHeight - document.getElementById('bottom-menu').offsetHeight - 50 });
        });
    </script>
</body>
</html>
