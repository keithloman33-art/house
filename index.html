<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>工程直線量度工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #1e272e; --surface: #2f3542; --accent: #00b894; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { position: fixed; overflow: hidden; width: 100%; height: 100%; margin: 0; background: #000; color: white; }
        body { display: flex; flex-direction: column; font-family: -apple-system, system-ui, sans-serif; }

        /* 頂部數據 */
        #data-header {
            background: rgba(47, 53, 66, 0.9); padding: 15px; text-align: center;
            border-bottom: 1px solid #444; z-index: 10; backdrop-filter: blur(5px);
        }
        .result-text { font-size: 18px; font-weight: bold; color: var(--accent); }

        /* 畫布 */
        #canvas-wrapper { flex: 1; position: relative; touch-action: none; background: #111; }

        /* 底部操作區 */
        #bottom-menu {
            background: var(--surface); padding: 10px 15px 35px 15px;
            display: flex; flex-direction: column; gap: 12px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5); z-index: 100;
        }

        #calib-row {
            display: flex; background: #3d4654; padding: 10px; border-radius: 12px;
            align-items: center; gap: 10px; border: 1px solid var(--primary);
        }
        #input-mm { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 18px; text-align: center; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn {
            background: #4b6584; color: white; border: none; border-radius: 12px;
            padding: 15px 5px; font-size: 14px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn.active { background: var(--primary); }
        .btn-main { background: var(--primary); grid-column: span 1; }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="data-header">
        量度長度：<span id="current-dist" class="result-text">0.00</span> mm
    </div>

    <div id="canvas-wrapper">
        <canvas id="c"></canvas>
    </div>

    <div id="bottom-menu">
        <div id="calib-row">
            <input type="number" id="input-mm" pattern="[0-9]*" placeholder="輸入基準長度 (mm)" value="1000">
            <button class="btn" style="background:var(--accent); min-width:80px;" onclick="setScale()">校準</button>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="document.getElementById('file-input').click()">🖼️ 圖紙</button>
            <button class="btn btn-main" onclick="addNewLine()">📏 新增線</button>
            <button class="btn" style="background:#eb4d4b" onclick="clearLines()">🗑️ 清空</button>
        </div>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const canvas = new fabric.Canvas('c', {
            width: window.innerWidth,
            height: window.innerHeight - 200,
            backgroundColor: '#111',
            selection: false
        });

        let pixelToMmRatio = 1;

        // --- 1. 雙指縮放與平移 (Pinch & Pan) ---
        canvas.on('mouse:wheel', function(opt) {
            let delta = opt.e.deltaY;
            let zoom = canvas.getZoom();
            zoom *= 0.999 ** delta;
            if (zoom > 20) zoom = 20;
            if (zoom < 0.01) zoom = 0.01;
            canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
            opt.e.preventDefault();
            opt.e.stopPropagation();
        });

        // 觸控平移支援
        let isDragging = false;
        let lastPosX, lastPosY;
        canvas.on('mouse:down', function(opt) {
            if (opt.e.touches && opt.e.touches.length > 1) return; // 雙指縮放時不平移
            if (!opt.target) {
                isDragging = true;
                lastPosX = opt.e.clientX || opt.e.touches[0].clientX;
                lastPosY = opt.e.clientY || opt.e.touches[0].clientY;
            }
        });
        canvas.on('mouse:move', function(opt) {
            if (isDragging) {
                let e = opt.e.touches ? opt.e.touches[0] : opt.e;
                let vpt = canvas.viewportTransform;
                vpt[4] += e.clientX - lastPosX;
                vpt[5] += e.clientY - lastPosY;
                canvas.requestRenderAll();
                lastPosX = e.clientX;
                lastPosY = e.clientY;
            }
        });
        canvas.on('mouse:up', () => isDragging = false);

        // --- 2. 核心量度線功能 ---
        function addNewLine() {
            const center = canvas.getVpCenter();
            const line = new fabric.Line([center.x - 50, center.y, center.x + 50, center.y], {
                stroke: '#ff7675',
                strokeWidth: 6,
                hasControls: true,
                hasBorders: false,
                transparentCorners: true, // 控制點完全透明
                cornerSize: 45,           // 增大觸控面積，雖然透明但好抓
                originX: 'center',
                originY: 'center',
                padding: 10
            });
            
            // 停用旋轉與縮放比例（只允許拉長短和移動）
            line.setControlsVisibility({
                bl: false, br: false, tl: false, tr: false, mtr: false
            });

            canvas.add(line);
            canvas.setActiveObject(line);
            updateDistance(line);
        }

        function updateDistance(obj) {
            if (!obj) return;
            const dx = (obj.x2 - obj.x1) * obj.scaleX;
            const dy = (obj.y2 - obj.y1) * obj.scaleY;
            const pxLen = Math.sqrt(dx*dx + dy*dy);
            const mmLen = (pxLen * pixelToMmRatio).toFixed(1);
            document.getElementById('current-dist').innerText = mmLen;
        }

        canvas.on('object:moving', (e) => updateDistance(e.target));
        canvas.on('object:scaling', (e) => updateDistance(e.target));
        canvas.on('selection:created', (e) => updateDistance(e.selected[0]));

        // --- 3. 校準比例 ---
        function setScale() {
            const activeLine = canvas.getActiveObject();
            if (!activeLine || activeLine.type !== 'line') {
                alert("請先選取畫面上的一條紅線對齊已知長度");
                return;
            }
            const realMm = document.getElementById('input-mm').value;
            const dx = (activeLine.x2 - activeLine.x1) * activeLine.scaleX;
            const dy = (activeLine.y2 - activeLine.y1) * activeLine.scaleY;
            const pxLen = Math.sqrt(dx*dx + dy*dy);
            
            pixelToMmRatio = realMm / pxLen;
            alert("校準完成！比例已更新。");
            updateDistance(activeLine);
        }

        // --- 4. 圖片處理 ---
        document.getElementById('file-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: ratio, scaleY: ratio, originX: 'left', originY: 'top'
                    });
                });
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function clearLines() { 
            if(confirm("確定清空所有量度線？")) {
                canvas.getObjects('line').forEach(obj => canvas.remove(obj));
                document.getElementById('current-dist').innerText = "0.00";
            }
        }

        window.addEventListener('resize', () => {
            canvas.setDimensions({ width: window.innerWidth, height: window.innerHeight - 200 });
        });
    </script>
</body>
</html>
