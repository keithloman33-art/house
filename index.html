<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>工程量度旗艦版 v10</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #1e272e; --surface: #2f3542; --accent: #00b894; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        html, body { position: fixed; overflow: hidden; width: 100%; height: 100%; margin: 0; background: #000; color: white; }
        body { display: flex; flex-direction: column; font-family: -apple-system, system-ui, sans-serif; }

        #data-header { background: rgba(0,0,0,0.8); padding: 12px; display: flex; justify-content: space-around; z-index: 10; border-bottom: 1px solid #333; }
        .stat-val { color: var(--accent); font-weight: bold; font-family: monospace; font-size: 18px; }

        #canvas-wrapper { flex: 1; background: #111; position: relative; }

        #bottom-menu { background: var(--surface); padding: 10px 10px 35px 10px; display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        #calib-ui { display: none; background: #3d4654; padding: 10px; border-radius: 12px; align-items: center; gap: 8px; border: 1px solid var(--primary); }
        #input-mm { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 18px; text-align: center; }
        
        .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn { background: #4b6584; color: white; border: none; border-radius: 12px; padding: 12px 2px; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .btn.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .btn-large { grid-column: span 2; flex-direction: row; justify-content: center; font-size: 14px; padding: 15px; }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="data-header">
        <div>長度: <span id="val-dist" class="stat-val">0</span> mm</div>
        <div>面積: <span id="val-area" class="stat-val">0.00</span> m²</div>
    </div>

    <div id="canvas-wrapper"><canvas id="c"></canvas></div>

    <div id="bottom-menu">
        <div id="calib-ui">
            <input type="number" id="input-mm" pattern="[0-9]*" value="1000">
            <button class="btn" style="background:var(--accent); min-width:60px;" onclick="confirmCalibration()">OK</button>
            <button class="btn" style="background:#666; min-width:60px;" onclick="cancelCalibration()">❌</button>
        </div>
        <div class="btn-row">
            <button class="btn" onclick="document.getElementById('file-input').click()"><span>🖼️</span>圖紙</button>
            <button id="calib-btn" class="btn" onclick="startCalibration()"><span>📏</span>比例</button>
            <button class="btn" onclick="createRectRoom()"><span>🧱</span>矩形</button>
            <button id="poly-btn" class="btn" onclick="togglePolyMode()"><span>🖊️</span>自由繪</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-large" style="background:#eb4d4b" onclick="clearCanvas()">🗑️ 清空</button>
            <button class="btn btn-large" style="background:var(--accent)" onclick="exportReport()">📋 導出</button>
        </div>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const canvas = new fabric.Canvas('c', {
            width: window.innerWidth,
            height: window.innerHeight - 220,
            backgroundColor: '#111',
            selection: false,
            allowTouchScrolling: false
        });

        let pixelToMmRatio = 1;
        let isPolyDrawing = false;
        let pointArray = [];
        let calibLine;

        // --- 1. 極速雙指縮放與平移 ---
        let lastDist = 0;
        let isDragging = false;
        let lastPosX, lastPosY;

        canvas.upperCanvasEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (e.touches.length === 1) {
                if (!canvas.findTarget(e)) {
                    isDragging = true;
                    lastPosX = e.touches[0].pageX; lastPosY = e.touches[0].pageY;
                }
            }
        });

        canvas.upperCanvasEl.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const zoom = canvas.getZoom() * (dist / lastDist);
                if (zoom > 0.01 && zoom < 20) {
                    canvas.zoomToPoint({ x: (e.touches[0].pageX + e.touches[1].pageX)/2, y: (e.touches[0].pageY + e.touches[1].pageY)/2 - 50 }, zoom);
                }
                lastDist = dist;
            } else if (isDragging && e.touches.length === 1) {
                const vpt = canvas.viewportTransform;
                vpt[4] += e.touches[0].pageX - lastPosX;
                vpt[5] += e.touches[0].pageY - lastPosY;
                canvas.requestRenderAll();
                lastPosX = e.touches[0].pageX; lastPosY = e.touches[0].pageY;
            }
        });
        canvas.upperCanvasEl.addEventListener('touchend', () => { isDragging = false; });

        // --- 2. 直線功能修正（座標位移邏輯） ---
        function createLine(coords, color) {
            const line = new fabric.Line(coords, {
                stroke: color, strokeWidth: 5, strokeUniform: true,
                hasBorders: false, transparentCorners: true, cornerSize: 50, cornerColor: 'transparent'
            });
            // 啟用端點控制
            line.controls.ml = new fabric.Control({ x: -0.5, y: 0, actionHandler: fabric.controlsUtils.changeLinePoint });
            line.controls.mr = new fabric.Control({ x: 0.5, y: 0, actionHandler: fabric.controlsUtils.changeLinePoint });
            line.setControlsVisibility({ bl:false, br:false, tl:false, tr:false, mtr:false, mt:false, mb:false });
            return line;
        }

        function startCalibration() {
            cancelCalibration();
            document.getElementById('calib-ui').style.display = 'flex';
            document.getElementById('calib-btn').classList.add('active');
            const center = canvas.getVpCenter();
            calibLine = createLine([center.x - 100, center.y, center.x + 100, center.y], '#ff7675');
            canvas.add(calibLine); canvas.setActiveObject(calibLine);
        }

        function confirmCalibration() {
            const mm = document.getElementById('input-mm').value;
            const pxLen = Math.sqrt(Math.pow(calibLine.x2 - calibLine.x1, 2) + Math.pow(calibLine.y2 - calibLine.y1, 2));
            pixelToMmRatio = mm / pxLen;
            cancelCalibration();
            alert("比例已校準");
        }

        function cancelCalibration() {
            if(calibLine) canvas.remove(calibLine);
            calibLine = null;
            document.getElementById('calib-ui').style.display = 'none';
            document.getElementById('calib-btn').classList.remove('active');
        }

        // --- 3. 自由繪與矩形回歸 ---
        function createRectRoom() {
            const rect = new fabric.Rect({
                left: 100, top: 100, width: 100, height: 100,
                fill: 'rgba(108, 92, 231, 0.3)', stroke: '#6c5ce7', strokeWidth: 2, strokeUniform: true,
                transparentCorners: true, cornerSize: 40, cornerColor: 'transparent', itemType: 'room'
            });
            canvas.add(rect); canvas.setActiveObject(rect);
        }

        function togglePolyMode() {
            isPolyDrawing = !isPolyDrawing;
            document.getElementById('poly-btn').classList.toggle('active', isPolyDrawing);
            if(!isPolyDrawing) { pointArray.forEach(p => canvas.remove(p)); pointArray = []; }
        }

        canvas.on('mouse:down', (opt) => {
            if (!isPolyDrawing || !opt.e.touches) return;
            const pointer = canvas.getPointer(opt.e);
            // 判斷是否點擊到第一個點 (綠色) 閉合
            if (pointArray.length > 2 && opt.target && opt.target.id === 'firstPoint') {
                const poly = new fabric.Polygon(pointArray.map(p => ({ x: p.left, y: p.top })), {
                    fill: 'rgba(108, 92, 231, 0.3)', stroke: '#6c5ce7', strokeWidth: 2, strokeUniform: true,
                    transparentCorners: true, cornerSize: 40, cornerColor: 'transparent', itemType: 'room'
                });
                canvas.add(poly);
                pointArray.forEach(p => canvas.remove(p)); pointArray = [];
                isPolyDrawing = false; document.getElementById('poly-btn').classList.remove('active');
                return;
            }
            const dot = new fabric.Circle({
                radius: 25, fill: pointArray.length === 0 ? '#00b894' : 'rgba(255,255,255,0.4)',
                left: pointer.x, top: pointer.y, originX: 'center', originY: 'center',
                selectable: true, id: pointArray.length === 0 ? 'firstPoint' : 'dot'
            });
            pointArray.push(dot); canvas.add(dot);
        });

        // --- 數據同步 ---
        function updateData(obj) {
            if(!obj) return;
            if(obj.type === 'line') {
                const len = Math.sqrt(Math.pow(obj.x2 - obj.x1, 2) + Math.pow(obj.y2 - obj.y1, 2));
                document.getElementById('val-dist').innerText = (len * pixelToMmRatio).toFixed(1);
            } else if(obj.itemType === 'room') {
                const area = (obj.getScaledWidth() * pixelToMmRatio / 1000) * (obj.getScaledHeight() * pixelToMmRatio / 1000);
                document.getElementById('val-area').innerText = Math.abs(area).toFixed(2);
            }
        }

        canvas.on({'object:modified': (e) => updateData(e.target), 'object:moving': (e) => updateData(e.target), 'selection:created': (e) => updateData(e.selected[0])});

        document.getElementById('file-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    canvas.clear();
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), { scaleX: ratio, scaleY: ratio });
                });
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function clearCanvas() { canvas.clear(); canvas.setBackgroundColor('#111'); }
        function exportReport() { alert("當前數據已顯示在頂部"); }
    </script>
</body>
</html>
