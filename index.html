<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>工程量度旗艦版 v7.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #1e272e; --surface: #2f3542; --accent: #00b894; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        html, body { position: fixed; overflow: hidden; width: 100%; height: 100%; margin: 0; background: #000; color: white; }
        body { display: flex; flex-direction: column; font-family: -apple-system, system-ui, sans-serif; }

        #data-header { background: rgba(0,0,0,0.6); padding: 10px; display: flex; justify-content: space-around; border-bottom: 1px solid #444; z-index: 10; font-size: 14px; }
        .stat-val { color: var(--accent); font-weight: bold; font-family: monospace; font-size: 16px; }

        #canvas-wrapper { flex: 1; background: #111; position: relative; overflow: hidden; }

        #bottom-menu { background: var(--surface); padding: 10px 10px 35px 10px; display: flex; flex-direction: column; gap: 8px; z-index: 100; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        
        /* 比例列 */
        #calib-ui { display: none; background: #3d4654; padding: 8px; border-radius: 10px; align-items: center; gap: 8px; border: 1px solid var(--primary); margin-bottom: 5px; }
        #input-mm { flex: 1; padding: 10px; border-radius: 8px; border: none; font-size: 16px; text-align: center; }
        
        .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .btn { background: #4b6584; color: white; border: none; border-radius: 10px; padding: 10px 2px; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .btn.active { background: var(--primary); }
        .btn-large { grid-column: span 2; flex-direction: row; justify-content: center; font-size: 13px; padding: 12px; }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="data-header">
        <div>長度: <span id="val-dist" class="stat-val">0</span> mm</div>
        <div>面積: <span id="val-area" class="stat-val">0.00</span> m²</div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="c"></canvas>
    </div>

    <div id="bottom-menu">
        <div id="calib-ui">
            <input type="number" id="input-mm" pattern="[0-9]*" placeholder="輸入基準長度(mm)" value="1000">
            <button class="btn" style="background:var(--accent); padding:10px" onclick="confirmCalibration()">OK</button>
            <button class="btn" style="background:#666; padding:10px" onclick="cancelCalibration()">取消</button>
        </div>

        <div class="btn-row">
            <button class="btn" onclick="document.getElementById('file-input').click()"><span>🖼️</span>圖紙</button>
            <button id="calib-btn" class="btn" onclick="startCalibration()"><span>📏</span>比例</button>
            <button class="btn" onclick="createRectRoom()"><span>🧱</span>矩形</button>
            <button id="poly-btn" class="btn" onclick="togglePolyMode()"><span>🖊️</span>自由繪</button>
        </div>

        <div class="btn-row">
            <button class="btn btn-large" style="background:#eb4d4b" onclick="clearCanvas()">🗑️ 清空</button>
            <button class="btn btn-large" style="background:var(--accent)" onclick="exportReport()">📋 導出</button>
        </div>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const canvas = new fabric.Canvas('c', {
            width: window.innerWidth,
            height: window.innerHeight - 220,
            backgroundColor: '#111',
            selection: false
        });

        let pixelToMmRatio = 1;
        let isPolyDrawing = false;
        let pointArray = [];
        let calibLine;

        // --- 1. 雙指縮放與平移核心代碼 ---
        canvas.on('touch:gesture', function(opt) {
            if (opt.e.touches && opt.e.touches.length === 2) {
                let zoom = canvas.getZoom();
                zoom *= opt.self.scale;
                if (zoom > 20) zoom = 20;
                if (zoom < 0.1) zoom = 0.1;
                canvas.setZoom(zoom);
                opt.e.preventDefault();
                opt.e.stopPropagation();
            }
        });

        let isDragging = false;
        let lastPosX, lastPosY;
        canvas.on('mouse:down', function(opt) {
            let evt = opt.e;
            if (evt.touches && evt.touches.length > 1) return;
            if (!opt.target) {
                isDragging = true;
                lastPosX = evt.touches ? evt.touches[0].clientX : evt.clientX;
                lastPosY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            }
        });
        canvas.on('mouse:move', function(opt) {
            if (isDragging) {
                let evt = opt.e;
                let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
                let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
                let vpt = canvas.viewportTransform;
                vpt[4] += clientX - lastPosX;
                vpt[5] += clientY - lastPosY;
                canvas.requestRenderAll();
                lastPosX = clientX;
                lastPosY = clientY;
            }
        });
        canvas.on('mouse:up', () => isDragging = false);

        // --- 2. 修正紅線：禁止縮放，只允許調整座標 ---
        function createLine(coords, color) {
            const line = new fabric.Line(coords, {
                stroke: color,
                strokeWidth: 5,
                hasBorders: false,
                transparentCorners: true,
                cornerSize: 40,
                originX: 'center',
                originY: 'center',
                padding: 10
            });
            // 關鍵：停用 Scaling，這樣拉動端點時不會改變 StrokeWidth
            line.setControlsVisibility({ bl:false, br:false, tl:false, tr:false, mtr:false });
            return line;
        }

        function startCalibration() {
            if(calibLine) canvas.remove(calibLine);
            document.getElementById('calib-ui').style.display = 'flex';
            document.getElementById('calib-btn').classList.add('active');
            calibLine = createLine([50, 200, 250, 200], '#ff7675');
            canvas.add(calibLine);
            canvas.setActiveObject(calibLine);
        }

        function confirmCalibration() {
            const mm = document.getElementById('input-mm').value;
            const pxLen = getLineLen(calibLine);
            pixelToMmRatio = mm / pxLen;
            canvas.remove(calibLine);
            document.getElementById('calib-ui').style.display = 'none';
            document.getElementById('calib-btn').classList.remove('active');
            alert("校準成功");
        }

        function cancelCalibration() {
            if(calibLine) canvas.remove(calibLine);
            document.getElementById('calib-ui').style.display = 'none';
            document.getElementById('calib-btn').classList.remove('active');
        }

        // --- 3. 面積與矩形功能 (保留) ---
        function createRectRoom() {
            const rect = new fabric.Rect({
                left: 100, top: 100, width: 100, height: 100,
                fill: 'rgba(108, 92, 231, 0.3)', stroke: '#6c5ce7', strokeWidth: 2,
                transparentCorners: true, cornerSize: 30, itemType: 'room'
            });
            canvas.add(rect);
            canvas.setActiveObject(rect);
        }

        function togglePolyMode() {
            isPolyDrawing = !isPolyDrawing;
            document.getElementById('poly-btn').classList.toggle('active', isPolyDrawing);
            canvas.selection = !isPolyDrawing;
        }

        canvas.on('mouse:down', (opt) => {
            if (!isPolyDrawing) return;
            const pointer = canvas.getPointer(opt.e);
            if (pointArray.length > 2 && opt.target && opt.target.id === 'firstPoint') {
                const poly = new fabric.Polygon(pointArray.map(p => ({ x: p.left, y: p.top })), {
                    fill: 'rgba(108, 92, 231, 0.3)', stroke: '#6c5ce7', strokeWidth: 2,
                    transparentCorners: true, cornerSize: 30, itemType: 'room'
                });
                canvas.add(poly);
                pointArray.forEach(p => canvas.remove(p));
                pointArray = [];
                isPolyDrawing = false;
                document.getElementById('poly-btn').classList.remove('active');
                return;
            }
            const dot = new fabric.Circle({
                radius: 20, fill: pointArray.length===0?'#00b894':'rgba(255,255,255,0.5)',
                left: pointer.x, top: pointer.y, originX:'center', originY:'center',
                selectable: true, id: pointArray.length===0?'firstPoint':'dot'
            });
            pointArray.push(dot); canvas.add(dot);
        });

        // --- 工具函數 ---
        function getLineLen(l) {
            return Math.sqrt(Math.pow((l.x2-l.x1)*l.scaleX, 2) + Math.pow((l.y2-l.y1)*l.scaleY, 2));
        }

        function updateData(obj) {
            if(!obj) return;
            if(obj.type === 'line') {
                document.getElementById('val-dist').innerText = (getLineLen(obj) * pixelToMmRatio).toFixed(1);
            } else if(obj.itemType === 'room') {
                const w = obj.width * obj.scaleX * pixelToMmRatio / 1000;
                const h = obj.height * obj.scaleY * pixelToMmRatio / 1000;
                document.getElementById('val-area').innerText = (w * h).toFixed(2);
            }
        }

        canvas.on({
            'object:scaling': (e) => updateData(e.target),
            'object:moving': (e) => updateData(e.target),
            'selection:created': (e) => updateData(e.selected[0])
        });

        document.getElementById('file-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), { scaleX: ratio, scaleY: ratio });
                });
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        function clearCanvas() { canvas.getObjects().forEach(o => canvas.remove(o)); }
        function exportReport() { alert("數據已更新至頂部狀態欄"); }
    </script>
</body>
</html>
