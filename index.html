<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>工程量度 App v16.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #1e272e; --surface: #2f3542; --accent: #00b894; --lock: #f1c40f; --danger: #eb4d4b; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: none; }
        html, body { position: fixed; overflow: hidden; width: 100%; height: 100%; margin: 0; background: #000; color: white; }
        body { display: flex; flex-direction: column; font-family: -apple-system, system-ui, sans-serif; }

        #version-tag { position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; z-index: 20; }
        #canvas-wrapper { flex: 1; background: #111; position: relative; }

        #bottom-menu { background: var(--surface); padding: 10px 10px 35px 10px; display: flex; flex-direction: column; gap: 8px; z-index: 100; border-top: 1px solid #444; }
        
        /* 精準旋轉控制區 */
        #rotate-ui { background: #3d4654; padding: 12px; border-radius: 12px; display: none; flex-direction: column; gap: 10px; }
        .rotate-controls { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .r-btn { background: #4b6584; color: white; border: none; border-radius: 8px; padding: 10px 5px; flex: 1; font-size: 14px; font-weight: bold; active { background: var(--primary); } }
        #rotate-val-display { min-width: 70px; text-align: center; font-family: monospace; font-size: 16px; color: var(--accent); }

        #calib-ui { display: none; background: #3d4654; padding: 10px; border-radius: 12px; align-items: center; gap: 8px; border: 1px solid var(--primary); }
        #input-mm { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 18px; text-align: center; background: #222; color: white; }
        
        .btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn { background: #4b6584; color: white; border: none; border-radius: 12px; padding: 12px 2px; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .btn.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }
        .btn-lock.active { background: var(--lock); color: black; }
        
        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="version-tag">Ver 16.0</div>

    <div id="canvas-wrapper"><canvas id="c"></canvas></div>

    <div id="bottom-menu">
        <div id="rotate-ui">
            <div class="rotate-controls">
                <button class="r-btn" onclick="stepRotate(-1)">-1°</button>
                <button class="r-btn" onclick="stepRotate(-0.1)">-0.1°</button>
                <div id="rotate-val-display">0.0°</div>
                <button class="r-btn" onclick="stepRotate(0.1)">+0.1°</button>
                <button class="r-btn" onclick="stepRotate(1)">+1°</button>
                <button class="r-btn" style="background:#576574; flex:0.6;" onclick="resetRotate()">0°</button>
            </div>
        </div>

        <div id="calib-ui">
            <input type="number" id="input-mm" pattern="[0-9]*" value="1000">
            <button class="btn" style="background:var(--accent); min-width:60px;" onclick="confirmCalibration()">OK</button>
            <button class="btn" style="background:#666; min-width:60px;" onclick="cancelCalibration()">❌</button>
        </div>

        <div class="btn-row">
            <button class="btn" onclick="document.getElementById('file-input').click()"><span>🖼️</span>圖紙</button>
            <button id="lock-btn" class="btn btn-lock" onclick="toggleLock()"><span>🔒</span>鎖定圖紙</button>
            <button id="calib-btn" class="btn" onclick="startCalibration()"><span>📏</span>比例</button>
            <button id="poly-btn" class="btn" onclick="togglePolyMode()"><span>🖊️</span>自由繪</button>
        </div>

        <div class="btn-row">
            <button class="btn" style="background:var(--danger); font-size:10px;" onclick="clearItems('calib')">🗑️ 清比例</button>
            <button class="btn" style="background:#576574; font-size:10px;" onclick="clearItems('room')">🧹 清圖案</button>
            <button class="btn" style="background:var(--primary); grid-column: span 2;" onclick="createRectRoom()"><span>🧱</span> 新增標註矩形</button>
        </div>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const canvas = new fabric.Canvas('c', {
            width: window.innerWidth,
            height: window.innerHeight - 180,
            backgroundColor: '#111',
            selection: false
        });

        let pixelToMmRatio = 1;
        let isPolyDrawing = false;
        let pointArray = [];
        let calibLine;
        let isLocked = false;
        let bgImg = null;
        let currentAngle = 0;

        // --- 1. 旋轉與鎖定邏輯 ---
        function toggleLock() {
            isLocked = !isLocked;
            document.getElementById('lock-btn').classList.toggle('active', isLocked);
            document.getElementById('rotate-ui').style.display = (isLocked || !bgImg) ? 'none' : 'flex';
            canvas.forEachObject(obj => { if(obj.itemType !== 'bg') obj.selectable = isLocked; });
            canvas.requestRenderAll();
        }

        function stepRotate(step) {
            if (!bgImg) return;
            currentAngle = parseFloat((currentAngle + step).toFixed(1));
            updateRotation();
        }

        function resetRotate() {
            currentAngle = 0;
            updateRotation();
        }

        function updateRotation() {
            if (!bgImg) return;
            document.getElementById('rotate-val-display').innerText = currentAngle.toFixed(1) + '°';
            bgImg.set('angle', currentAngle);
            canvas.requestRenderAll();
        }

        // --- 2. 手勢控制 (縮放/平移) ---
        let lastDist = 0, isDragging = false, lastPosX, lastPosY;

        canvas.upperCanvasEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                lastDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            } else if (e.touches.length === 1 && !isLocked) {
                if (!canvas.findTarget(e)) {
                    isDragging = true;
                    lastPosX = e.touches[0].pageX; lastPosY = e.touches[0].pageY;
                }
            }
        });

        canvas.upperCanvasEl.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                const zoom = canvas.getZoom() * (dist / lastDist);
                if (zoom > 0.05 && zoom < 20) {
                    canvas.zoomToPoint({ x: (e.touches[0].pageX + e.touches[1].pageX)/2, y: (e.touches[0].pageY + e.touches[1].pageY)/2 - 50 }, zoom);
                }
                lastDist = dist;
            } else if (isDragging && !isLocked) {
                const vpt = canvas.viewportTransform;
                vpt[4] += e.touches[0].pageX - lastPosX;
                vpt[5] += e.touches[0].pageY - lastPosY;
                canvas.requestRenderAll();
                lastPosX = e.touches[0].pageX; lastPosY = e.touches[0].pageY;
            }
        });
        canvas.upperCanvasEl.addEventListener('touchend', () => { isDragging = false; });

        // --- 3. 比例線與清空 ---
        function startCalibration() {
            if(!isLocked) toggleLock();
            if(calibLine) canvas.remove(calibLine);
            document.getElementById('calib-ui').style.display = 'flex';
            document.getElementById('calib-btn').classList.add('active');
            const center = canvas.getVpCenter();
            calibLine = new fabric.Rect({
                width: 200, height: 2, fill: '#ff7675', left: center.x - 100, top: center.y,
                originY: 'center', transparentCorners: true, cornerSize: 45, cornerColor: 'transparent',
                hasBorders: false, itemType: 'calib', strokeUniform: true
            });
            calibLine.setControlsVisibility({ mt:false, mb:false, ml:true, mr:true, bl:false, br:false, tl:false, tr:false, mtr:false });
            canvas.add(calibLine); canvas.setActiveObject(calibLine);
        }

        function confirmCalibration() {
            const mm = document.getElementById('input-mm').value;
            pixelToMmRatio = mm / (calibLine.width * calibLine.scaleX);
            document.getElementById('calib-ui').style.display = 'none';
            document.getElementById('calib-btn').classList.remove('active');
        }

        function cancelCalibration() {
            if(calibLine) canvas.remove(calibLine);
            document.getElementById('calib-ui').style.display = 'none';
            document.getElementById('calib-btn').classList.remove('active');
        }

        function clearItems(type) {
            const objs = canvas.getObjects();
            for (let i = objs.length - 1; i >= 0; i--) {
                if (objs[i].itemType === type || (type === 'room' && objs[i].itemType === 'label')) {
                    canvas.remove(objs[i]);
                }
            }
        }

        // --- 4. 矩形標註 ---
        function createRectRoom() {
            if(!isLocked) toggleLock();
            const center = canvas.getVpCenter();
            const rect = new fabric.Rect({
                left: center.x - 50, top: center.y - 50, width: 100, height: 100,
                fill: 'rgba(108, 92, 231, 0.2)', stroke: '#6c5ce7', strokeWidth: 1,
                strokeUniform: true, transparentCorners: true, cornerSize: 40,
                cornerColor: 'transparent', itemType: 'room'
            });
            const text = new fabric.Text('', { fontSize: 14, fill: '#fff', backgroundColor: 'rgba(0,0,0,0.6)', originX: 'center', originY: 'center', selectable: false, itemType: 'label', fontFamily: 'monospace' });
            rect.on('moving', () => updateRectLabel(rect, text));
            rect.on('scaling', () => updateRectLabel(rect, text));
            canvas.add(rect, text);
            updateRectLabel(rect, text);
            canvas.setActiveObject(rect);
        }

        function updateRectLabel(rect, text) {
            const w = (rect.getScaledWidth() * pixelToMmRatio).toFixed(0);
            const h = (rect.getScaledHeight() * pixelToMmRatio).toFixed(0);
            const area = (rect.getScaledWidth() * pixelToMmRatio / 1000) * (rect.getScaledHeight() * pixelToMmRatio / 1000);
            text.set({ text: `${w} x ${h} mm\n(${area.toFixed(2)} m²)`, left: rect.left + rect.getScaledWidth() / 2, top: rect.top + rect.getScaledHeight() / 2 });
        }

        // --- 5. 自由繪 ---
        function togglePolyMode() {
            isPolyDrawing = !isPolyDrawing;
            document.getElementById('poly-btn').classList.toggle('active', isPolyDrawing);
            if(isPolyDrawing && !isLocked) toggleLock();
        }

        canvas.on('mouse:down', (opt) => {
            if (!isPolyDrawing || !opt.e.touches) return;
            const pointer = canvas.getPointer(opt.e);
            if (pointArray.length > 2 && opt.target && opt.target.id === 'firstPoint') {
                const poly = new fabric.Polygon(pointArray.map(p => ({ x: p.left, y: p.top })), { fill: 'rgba(108, 92, 231, 0.2)', stroke: '#6c5ce7', strokeWidth: 1, strokeUniform: true, transparentCorners: true, cornerSize: 40, cornerColor: 'transparent', itemType: 'room' });
                canvas.add(poly);
                pointArray.forEach(p => canvas.remove(p)); pointArray = [];
                isPolyDrawing = false; document.getElementById('poly-btn').classList.remove('active');
                return;
            }
            const dot = new fabric.Circle({ radius: 25, fill: pointArray.length===0?'#00b894':'rgba(255,255,255,0.3)', left: pointer.x, top: pointer.y, originX:'center', originY:'center', id: pointArray.length===0?'firstPoint':'dot' });
            pointArray.push(dot); canvas.add(dot);
        });

        // --- 6. 檔案處理 ---
        document.getElementById('file-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    canvas.clear();
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                    img.set({ 
                        itemType: 'bg', selectable: false, 
                        originX: 'center', originY: 'center',
                        left: canvas.width / 2, top: canvas.height / 2
                    });
                    bgImg = img; canvas.add(img);
                    img.scale(ratio); img.sendToBack();
                    resetRotate();
                    document.getElementById('rotate-ui').style.display = 'flex';
                });
            };
            reader.readAsDataURL(e.target.files[0]);
        };
    </script>
</body>
</html>
