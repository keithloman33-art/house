<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>工程量度 App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <style>
        :root { --primary: #6c5ce7; --bg: #1e272e; --surface: #2f3542; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; background: var(--bg); color: white; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh;
        }

        /* 畫布區域 */
        #canvas-wrapper { flex: 1; position: relative; background: #000; touch-action: none; }
        
        /* 數據顯示 */
        #info-bar {
            position: absolute; top: 40px; left: 10px; right: 10px;
            background: rgba(47, 53, 66, 0.9); padding: 12px; border-radius: 12px;
            font-size: 14px; display: flex; justify-content: space-around;
            backdrop-filter: blur(10px); z-index: 50; border: 1px solid rgba(255,255,255,0.1);
        }
        .stat { text-align: center; }
        .stat-val { display: block; color: #55efc4; font-weight: bold; font-size: 16px; }

        /* 底部工具欄 */
        #toolbar { 
            background: var(--surface); padding: 15px 15px 35px 15px; 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.4); z-index: 100;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }

        .btn { 
            background: #4b6584; color: white; border: none; border-radius: 12px; 
            font-size: 12px; padding: 10px 5px; font-weight: bold; display: flex; 
            flex-direction: column; align-items: center; gap: 5px;
        }
        .btn.active { background: var(--primary); }
        .icon { font-size: 20px; }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="info-bar">
        <div class="stat">長寬 (m)<span id="val-dim" class="stat-val">--</span></div>
        <div class="stat">面積 (m²)<span id="val-area" class="stat-val">0.00</span></div>
    </div>

    <div id="canvas-wrapper">
        <canvas id="c"></canvas>
    </div>

    <div id="toolbar">
        <button class="btn" onclick="document.getElementById('file-input').click()">
            <span class="icon">📷</span>圖紙
        </button>
        <button id="calib-btn" class="btn" onclick="startCalibration()">
            <span class="icon">📏</span>比例
        </button>
        <button class="btn" onclick="createRectRoom()">
            <span class="icon">🧱</span>矩形
        </button>
        <button id="poly-btn" class="btn" onclick="togglePolyMode()">
            <span class="icon">🖊️</span>多邊形
        </button>
        <button class="btn" style="grid-column: span 2; background:#eb4d4b" onclick="canvas.clear()">
            清空所有物件
        </button>
        <button class="btn" style="grid-column: span 2; background:#20bf6b" onclick="exportReport()">
            導出摘要
        </button>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const canvas = new fabric.Canvas('c', {
            width: window.innerWidth,
            height: window.innerHeight - 220,
            allowTouchScrolling: true
        });

        let pixelToMmRatio = 1;
        let isPolyDrawing = false;
        let pointArray = [];
        let lineArray = [];

        // --- iOS 觸控縮放與平移支持 ---
        canvas.on('mouse:wheel', function(opt) {
            var delta = opt.e.deltaY;
            var zoom = canvas.getZoom();
            zoom *= 0.999 ** delta;
            if (zoom > 20) zoom = 20;
            if (zoom < 0.01) zoom = 0.01;
            canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
            opt.e.preventDefault();
            opt.e.stopPropagation();
        });

        // --- 載入圖紙 ---
        document.getElementById('file-input').onchange = function(e) {
            const reader = new FileReader();
            reader.onload = (f) => {
                fabric.Image.fromURL(f.target.result, (img) => {
                    const ratio = Math.min(canvas.width / img.width, canvas.height / img.height);
                    canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
                        scaleX: ratio, scaleY: ratio
                    });
                });
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        // --- 比例尺 (iOS prompt 版) ---
        function startCalibration() {
            const line = new fabric.Line([50, 150, 250, 150], { stroke: '#ff7675', strokeWidth: 5, hasControls: true });
            canvas.add(line);
            canvas.setActiveObject(line);
            setTimeout(() => {
                const mm = prompt("請輸入紅線代表的真實長度 (mm):", "1000");
                if(mm) {
                    pixelToMmRatio = parseFloat(mm) / (line.width * line.scaleX);
                    canvas.remove(line);
                    alert("比例尺設定成功");
                }
            }, 500);
        }

        // --- 繪圖功能 ---
        function setupRoom(obj) {
            obj.set({ fill: 'rgba(108, 92, 231, 0.4)', stroke: '#6c5ce7', strokeWidth: 2, itemType: 'room' });
            canvas.add(obj);
            canvas.setActiveObject(obj);
            updateData(obj);
        }

        function createRectRoom() {
            const rect = new fabric.Rect({ left: 100, top: 100, width: 100, height: 100 });
            setupRoom(rect);
        }

        function togglePolyMode() {
            isPolyDrawing = !isPolyDrawing;
            document.getElementById('poly-btn').classList.toggle('active', isPolyDrawing);
            if (!isPolyDrawing) resetPoly();
        }

        canvas.on('mouse:down', (opt) => {
            if (!isPolyDrawing) return;
            const pointer = canvas.getPointer(opt.e);
            if (pointArray.length > 2 && opt.target && opt.target.id === pointArray[0].id) {
                const poly = new fabric.Polygon(pointArray.map(p => ({ x: p.left, y: p.top })));
                setupRoom(poly);
                resetPoly();
                return;
            }
            const dot = new fabric.Circle({ radius: 10, fill: '#00b894', left: pointer.x, top: pointer.y, originX: 'center', originY: 'center', selectable: false, id: 'p'+Date.now() });
            pointArray.push(dot); canvas.add(dot);
        });

        function resetPoly() {
            pointArray.forEach(p => canvas.remove(p));
            pointArray = []; isPolyDrawing = false;
            document.getElementById('poly-btn').classList.remove('active');
        }

        function updateData(obj) {
            if (!obj || obj.itemType !== 'room') return;
            const w = (obj.width * obj.scaleX * pixelToMmRatio / 1000).toFixed(2);
            const h = (obj.height * obj.scaleY * pixelToMmRatio / 1000).toFixed(2);
            const area = (w * h).toFixed(2); // 簡化顯示
            document.getElementById('val-dim').innerText = `${w} x ${h}`;
            document.getElementById('val-area').innerText = area;
        }

        canvas.on('object:scaling', (e) => updateData(e.target));
        canvas.on('selection:created', (e) => updateData(e.selected[0]));

        function exportReport() {
            alert("報告已生成，請在電腦端查看完整數據。");
        }
    </script>
</body>
</html>
